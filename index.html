<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="color-scheme" content="light dark">
  <meta name="theme-color" content="#245b48">
  <meta name="description" content="小栞题库，组织学、物理与测量的随身练习本。支持离线刷题、错题复习与模拟考试。">
  <title>小栞题库 · 每一题，都算数</title>
  <link rel="stylesheet" href="style.css">
  <script defer src="questions.js"></script>
  <script defer src="app.js"></script>
</head>
<body>
  <header class="site-header">
    <a class="brand" href="index.html" aria-label="小栞题库首页"><span class="brand-mark" aria-hidden="true">栞</span><span>小栞题库<small>你的随身练习本</small></span></a>
    <span class="local-label">本地保存 · 随时继续</span>
  </header>
  <main class="shell">
    <section class="intro" aria-labelledby="welcome">
      <div><p class="eyebrow">一点积累，一点进步</p><h1 id="welcome">每一题，都算数。</h1><p class="muted">把知识练熟，把心里练稳。</p></div>
      <div class="stats" aria-label="学习进度">
        <div><strong id="total-stat">110</strong><span>题库总题</span></div>
        <div><strong id="done-stat">0</strong><span>已练题目</span></div>
        <div><strong id="wrong-stat">0</strong><span>待复习</span></div>
      </div>
    </section>
    <nav class="tabs" aria-label="学习模式">
      <button type="button" data-view="practice" class="active" aria-current="page">日常练习</button>
      <button type="button" data-view="wrong">错题本 <span id="wrong-count">0</span></button>
      <button type="button" data-view="exam">模拟考试</button>
    </nav>
    <div style="margin:12px 0 18px;padding:14px;border:2px solid #39856e;border-radius:14px"><button id="export-wrong" type="button" class="primary" style="width:100%;padding:15px;font-size:17px">📋 复制全部错题给小栞</button><p class="small muted" style="margin:8px 0 0">按钮就在这里！复制后回 ChatGPT 粘贴，答题进度不会清除。</p></div>
    <p id="storage-warning" class="warning" role="status" hidden></p>
    <section class="filters" aria-label="练习设置">
      <div><label for="subject">选择科目</label><select id="subject"><option value="组织学">组织学</option><option value="物理">物理</option><option value="测量">测量</option></select></div>
      <div id="chapter-filter" hidden><label for="chapter">选择章节</label><select id="chapter"><option value="全部">全部章节</option><option value="7">第7章</option><option value="8">第8章</option><option value="9">第9章</option><option value="10">第10章</option></select></div>
      <div id="type-filter"><label for="type">选择题型</label><select id="type"><option value="全部">全部题型</option></select></div>
      <div id="order-filter"><label for="order">练习顺序</label><select id="order"><option value="sequential">顺序练习</option><option value="random">随机练习</option></select></div>
    </section>
    <div class="workspace">
      <section id="workspace" aria-label="答题区"></section>
      <aside class="sidebar">
        <section class="note-card"><p class="eyebrow">学习足迹</p><h2>慢慢来，比较快。</h2><div class="progress-track"><div id="overall-bar"></div></div><p id="overall-text" class="muted"></p><p class="small muted">每次作答都会留下进度。错题答对后，将自动移出错题本。</p></section>
        <section class="note-card quiet"><h2>给复习留一点耐心</h2><p class="small muted">单选、判断即答即判；主观题先写下思路，再对照答案自评。</p><p class="small muted">标有“待核实”的内容请结合教材确认，模拟卷也会保留提醒。</p><p class="signature">小栞整理</p></section>
      </aside>
    </div>
    <footer>题库在本地，进步在自己手里。<span>组织学 · 物理 · 测量</span></footer>
  </main>
  <p id="toast" class="toast" role="status" hidden></p>
  <noscript><p class="warning">请启用浏览器的 JavaScript 后使用题库。</p></noscript>
</body>
</html>
